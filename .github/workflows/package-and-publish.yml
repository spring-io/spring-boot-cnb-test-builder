name: Package and Publish
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
jobs:
  publish:
    name: Package and Publish
    runs-on:
      - ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup-tools
        uses: buildpacks/github-actions/setup-tools@af8c06ccd592e27001cbf78083dcc9b47aa6652a # v6.1.1
      - id: setup-pack
        uses: buildpacks/github-actions/setup-pack@af8c06ccd592e27001cbf78083dcc9b47aa6652a # v6.1.1
      - id: login-docker
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - id: package-buildpack-amd64-only
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          cd buildpacks
          ORG="ghcr.io/${GITHUB_REPOSITORY_OWNER}"
          BP_ID="$(cat test-info/buildpack.toml | yj -t | jq -r .buildpack.id)"
          REPO="$(echo "$BP_ID" | sed 's/.*\///')"
          VERSION="$(cat test-info/buildpack.toml | yj -t | jq -r .buildpack.version)"
          PACKAGE="${ORG}/${REPO}"
          pack buildpack package "${PACKAGE}:${VERSION}-amd64" --config package.toml --target "linux/amd64" --publish 
          cd ..
        shell: bash
      - id: package-buildpack
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          cd buildpacks
          ORG="ghcr.io/${GITHUB_REPOSITORY_OWNER}"
          BP_ID="$(cat test-info/buildpack.toml | yj -t | jq -r .buildpack.id)"
          REPO="$(echo "$BP_ID" | sed 's/.*\///')"
          VERSION="$(cat test-info/buildpack.toml | yj -t | jq -r .buildpack.version)"
          PACKAGE="${ORG}/${REPO}"
          pack buildpack package "${PACKAGE}:${VERSION}" --config package.toml --target "linux/amd64" --target "linux/arm64" --publish 
          cd ..
        shell: bash
      - id: package-builder-amd64-only
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          cd builder
          ORG="ghcr.io/${GITHUB_REPOSITORY_OWNER}"
          REPO=$(echo "${{ github.repository }}" | sed 's/^.*\///')
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          PACKAGE="${ORG}/${REPO}"
          pack builder create "${PACKAGE}:${VERSION}-amd64" --config builder.toml --target "linux/amd64" --publish
          cd ..
        shell: bash
      - id: package-builder
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          cd builder
          ORG="ghcr.io/${GITHUB_REPOSITORY_OWNER}"
          REPO=$(echo "${{ github.repository }}" | sed 's/^.*\///')
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          PACKAGE="${ORG}/${REPO}"
          pack builder create "${PACKAGE}:${VERSION}" --config builder.toml --target "linux/amd64" --target "linux/arm64" --publish
          cd ..
        shell: bash
